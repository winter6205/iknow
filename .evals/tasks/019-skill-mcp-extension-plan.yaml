id: 019-skill-mcp-extension-plan
tier: fast
description: "#337 skill+MCP extension — spec and plan artifacts in place"
repo: .
test_command: |
  set -e
  test -f specs/337-skill-mcp-extension.md || { echo "FAIL: spec missing"; exit 1; }
  grep -q "minimal-change-verifier: \*\*yes\*\*" specs/337-skill-mcp-extension.md || { echo "FAIL: ACR verdict not all-yes"; exit 1; }
  test -f plans/337-skill-mcp-extension.md || { echo "FAIL: plan missing"; exit 1; }
  n=$(grep -cE "^### (D|T)[0-9]+\. \`\[(decision|implementation)\]\`" plans/337-skill-mcp-extension.md)
  [ "$n" -ge 11 ] || { echo "FAIL: tracer bullets < 11 (got $n)"; exit 1; }
  grep -q "Per-ticket loop" plans/337-skill-mcp-extension.md || { echo "FAIL: per-ticket loop missing"; exit 1; }
  echo "PASS: #337 spec+plan artifacts OK"
prompt: |
  Run `bash .evals/run.sh`. Confirms 019-skill-mcp-extension-plan exits 0:
  spec exists with all-yes ACR verdict and plan exists with >=11 tagged
  tracer bullets carrying the per-ticket loop.
