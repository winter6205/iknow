id: 555-default-subagent-scheduling-plan
tier: fast
description: "Plan #555 default-path spawn guidance 默认守卫 — build-engine 停 coordinator 默认注入 + spawn-subagent-tool 仍导出带 description 的工具 + description 不含嵌套政策 + 受影响测试全绿。"
repo: .
test_command: |
  set -e
  # T2 决议:build-engine 默认路径不再注入 coordinatorText: IKNOW_COORDINATOR_TEXT
  if grep -qF "coordinatorText: IKNOW_COORDINATOR_TEXT" src/harness/build-engine.ts; then
    echo "FAIL: build-engine.ts 仍含 coordinatorText: IKNOW_COORDINATOR_TEXT 默认注入"
    exit 1
  fi
  # T1 决议:spawn-subagent-tool 仍导出 createSpawnSubAgentTool + description 字段
  grep -qE "createSpawnSubAgentTool" src/harness/subagent/spawn-subagent-tool.ts || { echo "FAIL: spawn-subagent-tool.ts 缺 createSpawnSubAgentTool 导出"; exit 1; }
  grep -qE "description:" src/harness/subagent/spawn-subagent-tool.ts || { echo "FAIL: spawn-subagent-tool.ts 缺 description 字段"; exit 1; }
  # T1 决议:description 不应包含嵌套政策句(nested / caps at one level)
  if grep -qE "nested.*spawn_subagent|caps at one level" src/harness/subagent/spawn-subagent-tool.ts; then
    echo "FAIL: spawn-subagent-tool.ts description 仍含嵌套政策"
    exit 1
  fi
  # 受影响测试套件全绿
  npx vitest run tests/subagent/spawn-subagent.test.ts tests/harness/identity/coordinator-segment.test.ts tests/harness/build-engine.test.ts tests/tui/deps-tools.test.ts || { echo "FAIL: 受影响测试有红"; exit 1; }
  echo "PASS: plan #555 三 commit 结构 OK (T1 desc + T2 停注入 + T3 守卫)"
prompt: |
  Structural gate for plan #555 (default-path spawn guidance, T1→T2→T3).
  Confirms: T2 build-engine default no longer injects IKNOW_COORDINATOR_TEXT
  via coordinatorText spread; T1 spawn-subagent-tool still exports
  createSpawnSubAgentTool with a description field and no nested-spawn
  policy sentence; affected test suites stay green.
  Run `bash .evals/run.sh --task 555-default-subagent-scheduling-plan`.
