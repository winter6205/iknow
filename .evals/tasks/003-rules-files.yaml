id: 003-rules-files
tier: fast
description: "Verify .claude/rules/ has at least one rule file (.md)"
repo: .
test_command: |
  set -e
  DIR=".claude/rules"
  [ -d "$DIR" ] || { echo "FAIL: $DIR/ missing"; exit 1; }

  COUNT=$(find "$DIR" -maxdepth 1 -name '*.md' -type f | wc -l)
  if [ "$COUNT" -lt 1 ]; then
    echo "FAIL: $DIR/ has $COUNT .md files, need ≥1"
    exit 1
  fi

  echo "PASS: $DIR/ has $COUNT rule file(s)"
prompt: |
  Run `bash .evals/run.sh --task 003-rules-files`.
  Verifies .claude/rules/ has ≥1 .md file. Catches: empty rules dir
  (rules promised in CLAUDE.md but no file backs them).
