id: 005-update-sh-executable
tier: fast
description: "Verify scripts/update.sh exists + is valid bash + supports --help"
repo: .
test_command: |
  set -e
  UPDATE="scripts/update.sh"

  [ -f "$UPDATE" ] || { echo "FAIL: $UPDATE missing"; exit 1; }

  # Bash syntax check
  if ! bash -n "$UPDATE" 2>/dev/null; then
    echo "FAIL: $UPDATE failed bash -n syntax check"
    exit 1
  fi

  # Should expose --help (so operators can learn usage)
  if ! bash "$UPDATE" --help 2>&1 | grep -qiE 'usage|update'; then
    echo "FAIL: $UPDATE --help does not return Usage/Update info"
    exit 1
  fi

  echo "PASS: $UPDATE exists + bash syntax OK + --help works"
prompt: |
  Run `bash .evals/run.sh --task 005-update-sh-executable`.
  Verifies scripts/update.sh: file exists, bash syntax OK, --help
  returns usage info. Catches: rename/deletion of update.sh, syntax
  drift, broken --help flag (operators stuck).
