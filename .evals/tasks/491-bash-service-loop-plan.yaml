id: 491-bash-service-loop-plan
tier: fast
description: "Plan structure gate — plans/bash-service-loop.md tracer bullets carry tag + binary acceptance + per-ticket loop"
repo: .
test_command: |
  set -e
  f=plans/bash-service-loop.md
  test -f "$f" || { echo "FAIL: plan file missing"; exit 1; }
  bullets=$(grep -cE '^[0-9]+\. \*\*' "$f")
  [ "$bullets" -ge 3 ] || { echo "FAIL: fewer than 3 tracer bullets ($bullets)"; exit 1; }
  impl=$(grep -cE '`\[implementation\]`' "$f")
  loops=$(grep -c 'Per-ticket loop: tdd' "$f")
  [ "$impl" -eq "$loops" ] || { echo "FAIL: implementation bullets ($impl) != per-ticket loops ($loops)"; exit 1; }
  acc=$(grep -c 'Acceptance:' "$f")
  [ "$acc" -ge "$bullets" ] || { echo "FAIL: acceptance count ($acc) < bullets ($bullets)"; exit 1; }
  echo "PASS: plan structure OK ($bullets bullets, $impl implementation bullets with loops, $acc acceptance criteria)"
prompt: |
  Structural gate for plans/bash-service-loop.md (bash 服务启动+测试闭环, #491/#502/#503).
  Confirms every tracer bullet carries a tag, a binary acceptance criterion, and every
  implementation bullet embeds the ADR-0012 per-ticket loop line.
