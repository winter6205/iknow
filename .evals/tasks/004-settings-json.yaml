id: 004-settings-json
tier: fast
description: "Verify .claude/settings.json is valid JSON + has hooks or permissions section"
repo: .
test_command: |
  set -e
  SETTINGS=".claude/settings.json"

  if [ ! -f "$SETTINGS" ]; then
    # settings.local.json is acceptable (project-local override pattern)
    if [ -f ".claude/settings.local.json" ]; then
      echo "PASS: .claude/settings.local.json exists (project-local override)"
      exit 0
    fi
    echo "FAIL: $SETTINGS and .claude/settings.local.json both missing"
    exit 1
  fi

  # Validate JSON parses
  if ! jq empty "$SETTINGS" 2>/dev/null; then
    echo "FAIL: $SETTINGS is not valid JSON"
    exit 1
  fi

  # Should have hooks OR permissions (or both)
  HAS_HOOKS=$(jq 'has("hooks")' "$SETTINGS" 2>/dev/null || echo "false")
  HAS_PERMS=$(jq 'has("permissions")' "$SETTINGS" 2>/dev/null || echo "false")
  if [ "$HAS_HOOKS" != "true" ] && [ "$HAS_PERMS" != "true" ]; then
    echo "FAIL: $SETTINGS missing both hooks and permissions sections"
    exit 1
  fi

  echo "PASS: $SETTINGS is valid JSON with hooks=$HAS_HOOKS permissions=$HAS_PERMS"
prompt: |
  Run `bash .evals/run.sh --task 004-settings-json`.
  Verifies .claude/settings.json (or .claude/settings.local.json) is
  valid JSON AND contains hooks or permissions section. Catches:
  malformed JSON, accidental overwrite to empty {}, missing security
  configuration.
