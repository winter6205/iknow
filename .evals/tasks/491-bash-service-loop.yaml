id: 491-bash-service-loop
tier: medium
description: "Bash service loop (#491) — background spawn + bash_output/bash_stop + conversation scope + stale reap + network opt-in e2e"
repo: .
files_to_fix:
  - src/harness/background/manager.ts
  - src/harness/aci/tools/bash.ts
  - src/harness/sandbox/bwrap.ts
  - src/harness/permission/policy.ts
test_command: |
  set -e
  test -d src/harness/background || { echo "FAIL: src/harness/background/ missing"; exit 1; }
  grep -q 'network' src/harness/sandbox/bwrap.ts || { echo "FAIL: bwrap network branch missing"; exit 1; }
  npx vitest run \
    tests/harness/background \
    tests/harness/aci/bash-background.test.ts \
    tests/harness/aci/bash-output-stop.test.ts \
    tests/harness/aci/bash-service-loop.e2e.test.ts \
    tests/harness/sandbox/bwrap.test.ts \
    tests/harness/permission/policy.test.ts
prompt: |
  Implement plans/bash-service-loop.md (wayfinder map #440 tickets #502/#503, decisions in #491).
  Confirms the full closed loop: bash background spawn returns immediately, bash_output reads
  logs, bash_stop kills the process group, conversation scope rejects cross-conversation access,
  startup stale-reap reconciles orphaned records, and network:true drops --unshare-net behind a
  mandatory ask (full_auto not exempt).
