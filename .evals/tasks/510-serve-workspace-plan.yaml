id: "510-serve-workspace-plan"
description: "serve/Web 工作空间制度计划结构守卫（禁止自动 cwd）"
tier: fast
repo: .
test_command: |
  bash -e -c '
    test -f plans/serve-workspace.md
    test -f specs/serve-workspace.md
    grep -E "^\s*[0-9]+\." plans/serve-workspace.md | wc -l | awk "{exit !(\$1>=3)}"
    grep -q "\\[decision\\]" plans/serve-workspace.md
    grep -q "\\[implementation\\]" plans/serve-workspace.md
    grep -q "Per-ticket loop" plans/serve-workspace.md
    grep -q "OVERALL: PASS" plans/serve-workspace.md
    grep -q "ADR-0023" plans/serve-workspace.md specs/serve-workspace.md
    grep -q "serve-workspace.md" specs/README.md
  '
success: "pass"
budget:
  max_turns: 1
prompt: |
  Plan SSOT: plans/serve-workspace.md. Spec: specs/serve-workspace.md.
  Confirms tracer-bullet list ≥3, D1 decision + implementation tags, ACR PASS, ADR-0023 named.
