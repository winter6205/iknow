name: test

# 测试分两级：
#
#   test-fast  — PR 级快速门（required check）。只跑快速 vitest subset，
#                目标 ~5min 内给 PR 通过/失败反馈，避免 PR 每次都等全量
#                15min。
#   test-full  — 全量兜底（nightly cron + manual dispatch）。保留原 test
#                job 完整内容（vitest --retry 1 + CI 实证排除集）。
#
# CI 环境限制（实测）：GitHub Actions 标准 runner 的容器不允许
# user-namespace 网络隔离（bwrap --unshare-net → RTM_NEWADDR:
# Operation not permitted），而 bwrap 是运行时硬依赖（spec
# security-guardrails.md #123）。因此依赖 bwrap 物理执行的 sandbox/
# ACI 测试在标准 runner 上结构性跑不了，保留在本地（WSL）验证，
# CI 排除它们 —— 不删测试，仅 CI 不跑。排除集是 CI 实证失败集。
#
# 排除集 SSOT 在 vitest.ci-excludes.ts（不再是本文件里的 --exclude 长串）：
#   CI_EXCLUDES      — 两个 job 共同（bwrap 物理执行 + 装配依赖 bwrap 类）
#   CI_FAST_EXCLUDES — test-fast 额外（e2e / integration / secret-roundtrip
#                      整目录；该 job 不装 bwrap）
# 两个 job 各自经 config overlay 消费：
#   test-fast → vitest.ci-fast.config.ts（不装 bwrap）
#   test-full → vitest.ci.config.ts（装 bwrap）
# 双向校验见 scripts/ci-check-test-excludes.ts（正向覆盖 + 反向死条目）。
#
# 另：TUI 时序类测试在 runner 上用 --retry 1 吸收偶发 flaky（重试后
# 仍失败才是真失败）。
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
  schedule:
    # nightly 全量兜底（UTC 03:00 = CST 11:00）
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  # PR 级快速门。目标 ~5min 内给 PR 通过/失败反馈。
  # 不装 bubblewrap —— 沙箱/ACI 测试在 runner 上结构性跑不通（无
  # user-namespace + bwrap 物理执行），靠 vitest.ci-fast.config.ts 的
  # exclude 拦掉（SSOT 见 vitest.ci-excludes.ts）。runner 跑不通的测试
  # 由本地 WSL 全量验证；CI 仅缩短反馈时间。TUI 时序 flake 靠 --retry 1
  # 兜底（与 test-full 一致）。
  test-fast:
    runs-on: ubuntu-latest
    # 20 分钟，与 test-full 对齐。原先是 8 分钟，但那是从"大部分测试快速
    # 失败"时代留下的数字：`--bail=10` 每次都在 6 分钟内早停，所以 8 分钟看似
    # 从未被逼近。bwrap 的失败修好后没有失败可 bail，vitest 真正跑完全量，
    # 8 分钟随即变成硬墙——run 被判 cancelled 而非 failure，掩盖了"它其实
    # 一直跑不完"这个事实（test-fast 收集 11016 项，test-full 11092 项，
    # 差距仅 0.7%）。
    #
    # 注意这只止血，不解决"fast 该有多快"：CI_FAST_EXCLUDES 目前只有 3 个
    # 整目录，fast 与 full 几乎同规模。那个是设计问题，不在本次修复范围。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # dist/ 是 gitignore 产物，不随 checkout 存在。trace-mcp startup 的两条
      # 用例（bin symlink / dist/trace-mcp/main.js symlink）需要真产物才真跑，
      # 否则会走 ctx.skip 静默变 skip —— 那是 CI 覆盖净减少。这里显式 build
      # 一次（本地由 npm test 的 pretest 承担）。tsc 约 40s，8min 预算内。
      - name: Build (dist for trace-mcp startup tests)
        run: npm run build
      - name: Check bwrap test excludes (CI guard — #467 merge regression)
        run: npx tsx scripts/ci-check-test-excludes.ts
      - name: Vitest fast subset (bail-10 + retry-1 for flaky timing)
        # 排除集 = vitest.ci-fast.config.ts（= 本地 config + CI_EXCLUDES +
        # CI_FAST_EXCLUDES）。分类与逐条理由的 SSOT 在 vitest.ci-excludes.ts；
        # 本 job 不装 bwrap，故比 test-full 多排 e2e / integration /
        # secret-roundtrip 整目录。runner 跑不通的测试由本地 WSL 全量验证，
        # 排除仅影响 CI，不删测试。
        run: npx vitest run --config vitest.ci-fast.config.ts --retry 1 --bail=10

  # 全量兜底（nightly cron + manual dispatch）。内容 = 原 test job。
  test-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # bwrap 是运行时硬依赖（spec #123）：非 sandbox 的测试装配阶段也
      # 会 createBashTool → requireBwrap，缺失即 fail-loud。runner 默认
      # 无 bwrap，先安装让可装配的测试能跑。依赖 bwrap 物理执行的
      # sandbox 测试仍由下方 --exclude 排除（runner 无 user-namespace）。
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # dist/ 是 gitignore 产物，不随 checkout 存在。trace-mcp startup 的两条
      # 用例需要真产物才真跑，否则 ctx.skip 静默变 skip（CI 覆盖净减少）。
      - name: Build (dist for trace-mcp startup tests)
        run: npm run build
      - name: Check bwrap test excludes (CI guard — #467 merge regression)
        run: npx tsx scripts/ci-check-test-excludes.ts
      - name: Test suite (full — exclude sandbox-dependent, retry flaky)
        # 排除集 = vitest.ci.config.ts（= 本地 config + CI_EXCLUDES）。
        # 分类与逐条理由的 SSOT 在 vitest.ci-excludes.ts。本 job 已装 bwrap，
        # 能装配的测试照跑；仅物理执行类仍跑不了（runner 无 user-namespace）。
        # 注意：sandbox/bwrap.test、resource-limits 等纯逻辑测试不真实 spawn
        #   bwrap，CI 通过，不排除。
        run: npx vitest run --config vitest.ci.config.ts --retry 1
