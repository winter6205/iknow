name: test

# 测试分两级：
#
#   test-fast  — PR 级快速门（required check）。只跑快速 vitest subset，
#                目标 ~5min 内给 PR 通过/失败反馈，避免 PR 每次都等全量
#                15min。
#   test-full  — 全量兜底（nightly cron + manual dispatch）。保留原 test
#                job 完整内容（vitest --retry 1 + CI 实证排除集）。
#
# CI 环境限制（实测）：GitHub Actions 标准 runner 的容器不允许
# user-namespace 网络隔离（bwrap --unshare-net → RTM_NEWADDR:
# Operation not permitted），而 bwrap 是运行时硬依赖（spec
# security-guardrails.md #123）。因此依赖 bwrap 物理执行的 sandbox/
# ACI 测试在标准 runner 上结构性跑不了，保留在本地（WSL）验证，
# CI 排除它们 —— 不删测试，仅 CI 不跑。排除集是 CI 实证失败集。
#
# 另：TUI 时序类测试在 runner 上用 --retry 1 吸收偶发 flaky（重试后
# 仍失败才是真失败）。
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
  schedule:
    # nightly 全量兜底（UTC 03:00 = CST 11:00）
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  # PR 级快速门。目标 ~5min 内给 PR 通过/失败反馈。
  # 排除集镜像 test-full（CI 实证失败集：bwrap 装配/物理执行依赖 +
  # TUI 时序 flake）。runner 跑不通的测试由本地 WSL 全量验证；CI 仅
  # 缩短反馈时间。TUI 时序 flake 靠 --retry 1 兜底（与 test-full 一致）。
  # 注：不装 bubblewrap —— 沙箱/ACI 测试在 runner 上结构性跑不通（无
  # user-namespace + bwrap 物理执行），纯靠 --exclude 拦掉。本地 WSL
  # 验证，CI 缩短反馈时间。
  test-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Check bwrap test excludes (CI guard — #467 merge regression)
        run: npx tsx scripts/ci-check-test-excludes.ts
      - name: Vitest fast subset (bail-10 + retry-1 for flaky timing)
        # 排除集 = test-full 镜像。bwrap 物理执行类（runner 无 user-namespace）：
        #   bash-sandbox / demo / interrupt-routing / bash / grep /
        #   mcp-chain / skill-mcp-acceptance / build-engine / ensure-deps /
        #   secret-roundtrip/（整目录，不装 bwrap 所以全目录排除）。
        # 装配依赖 bwrap 类（bwrap 缺失时 requireBwrap fail-loud）：
        #   permission / registry / system-injection / max-turns-serve /
        #   deps-tools / build-engine-hooks（经 buildHarnessEngine →
        #   createDefaultAciRegistry → createBashTool → requireBwrap）。
        #   #468 新增：worker-tool-surface / worker.test.ts 走真实
        #   createWorkerDeps → createDefaultAciRegistry → createBashTool
        #   → requireBwrap，同属装配依赖 bwrap 类，一并排除。
        #   #562 新增：envelope-role / tool-constraints /
        #   bash-mode-channel（皆走 createWorkerDeps → createBashTool →
        #   requireBwrap 装配链），一并排除。
        #   ADR-0037 / #814 实证：hub-worktree-isolation 经 hub executor
        #   真 mutate → runInSandbox → requireBwrap（注释里的
        #   buildHarnessEngine 不命中 ci-check 调用形态，须手加）。
        # 慢/重路径 + TUI 时序 flaky（runner 环境偶发，--retry 1 兜底）：
        #   e2e / integration / banner-scroll-fixes / logo-persists。
        #   e2e / integration 用 'dir/**' glob 排除整目录（vitest exclude
        #   glob 语义，目录级剪枝 + 文件级 picomatch 双保险）。
        # 本地 WSL 全量绿；排除仅影响 CI，不删测试。
        run: |
          npx vitest run --retry 1 --bail=10 \
            --exclude 'tests/e2e/**' \
            --exclude 'tests/integration/**' \
            --exclude tests/harness/aci/bash-sandbox.test.ts \
            --exclude tests/harness/aci/bash-background.test.ts \
            --exclude tests/harness/aci/bash-output-stop.test.ts \
            --exclude tests/harness/aci/bash-service-loop.e2e.test.ts \
            --exclude tests/harness/aci/demo.test.ts \
            --exclude tests/harness/aci/interrupt-routing.test.ts \
            --exclude tests/harness/aci/tools/bash.test.ts \
            --exclude tests/harness/aci/tools/bash-readonly.test.ts \
            --exclude tests/harness/aci/tools/grep.test.ts \
            --exclude tests/harness/aci/tools/query-trace.test.ts \
            --exclude tests/harness/aci/permission.test.ts \
            --exclude tests/harness/aci/registry-workspace-root.test.ts \
            --exclude tests/harness/aci/tools/d9-description-guard.test.ts \
            --exclude tests/harness/aci/tools/registry.test.ts \
            --exclude tests/harness/aci/tools/registry-lsp-ctx.test.ts \
            --exclude tests/harness/agent-status-bar.test.ts \
            --exclude tests/harness/identity/agent-status-read-rule.test.ts \
            --exclude tests/harness/identity/system-injection.test.ts \
            --exclude tests/session-api/max-turns-serve.test.ts \
            --exclude tests/session-api/workspace-bind.test.ts \
            --exclude tests/session-api/hub-worktree-isolation.test.ts \
            --exclude tests/tui/deps-tools.test.ts \
            --exclude tests/cli/tui-deps-subagent-trace-factory.test.ts \
            --exclude tests/cli/chat-subagent-trace.test.ts \
            --exclude tests/build-engine-hooks.test.ts \
            --exclude tests/integration/mcp-chain.test.ts \
            --exclude tests/e2e/skill-mcp-acceptance.test.ts \
            --exclude tests/harness/build-engine.test.ts \
            --exclude tests/harness/build-engine-mcp-roots.test.ts \
            --exclude tests/harness/build-engine-auto-memory.test.ts \
            --exclude tests/harness/build-engine-subagent-trace.test.ts \
            --exclude tests/harness/graph/run-graph-assembly.test.ts \
            --exclude tests/session-api/ensure-deps-aci-tools.test.ts \
            --exclude tests/subagent/worker-tool-surface.test.ts \
            --exclude tests/subagent/worker.test.ts \
            --exclude tests/subagent/worker-lsp-wiring.test.ts \
            --exclude tests/subagent/envelope-role.test.ts \
            --exclude tests/subagent/tool-constraints.test.ts \
            --exclude tests/subagent/bash-mode-channel.test.ts \
            --exclude tests/tui/banner-scroll-fixes.test.tsx \
            --exclude tests/tui/logo-persists.test.tsx \
            --exclude 'tests/harness/secret-roundtrip/**' \
            --exclude tests/harness/mcp/zero-linkage-guard.test.ts \
            --exclude tests/harness/mcp/build-engine-mcp-overview.test.ts \
            --exclude tests/harness/sandbox/runner.test.ts \
            --exclude tests/subagent/envelope-freeze.test.ts

  # 全量兜底（nightly cron + manual dispatch）。内容 = 原 test job。
  test-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # bwrap 是运行时硬依赖（spec #123）：非 sandbox 的测试装配阶段也
      # 会 createBashTool → requireBwrap，缺失即 fail-loud。runner 默认
      # 无 bwrap，先安装让可装配的测试能跑。依赖 bwrap 物理执行的
      # sandbox 测试仍由下方 --exclude 排除（runner 无 user-namespace）。
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Check bwrap test excludes (CI guard — #467 merge regression)
        run: npx tsx scripts/ci-check-test-excludes.ts
      - name: Test suite (full — exclude sandbox-dependent, retry flaky)
        # 排除集 = 两次 CI 实证失败集的并集（bwrap 物理执行依赖 + 装配
        # 依赖 bwrap 缺失 + TUI 时序 flaky）。本地 WSL 全量绿；排除仅
        # 影响 CI，不删测试，sandbox 在本地验证。
        #   bwrap 物理执行类（无 user-namespace 的 runner 起不来）：
        #     bash-sandbox / demo / interrupt-routing / bash / grep /
        #     mcp-chain / skill-mcp-acceptance / build-engine / ensure-deps /
        #     secret-roundtrip/e2e（chat × roundtrip 用例 createBashTool
        #     真实 spawn echo 还原占位符；#406 合并时遗漏，CI 实证
        #     bashResult.code 1!==0）
        #   装配依赖 bwrap 类（bwrap 缺失时 requireBwrap fail-loud，
        #   装了也仅能装配不能执行）：
        #     permission / registry / system-injection / max-turns-serve /
        #     deps-tools / build-engine-hooks（经 buildHarnessEngine →
        #     createDefaultAciRegistry → createBashTool → requireBwrap）。
        #   #468 新增：worker-tool-surface / worker.test.ts 走真实
        #   createWorkerDeps → createDefaultAciRegistry → createBashTool
        #   → requireBwrap，同属装配依赖 bwrap 类，一并排除。
        #   #562 新增：envelope-role / tool-constraints /
        #   bash-mode-channel（皆走 createWorkerDeps → createBashTool →
        #   requireBwrap 装配链），一并排除。
        #   TUI 时序 flaky（runner 环境偶发，--retry 1 兜底）：
        #     banner-scroll-fixes / logo-persists
        # 注意：sandbox/bwrap.test、resource-limits 等纯逻辑测试在 CI
        #   通过（不真实 spawn bwrap），不排除。
        run: |
          npx vitest run --retry 1 \
            --exclude tests/harness/aci/bash-sandbox.test.ts \
            --exclude tests/harness/aci/bash-background.test.ts \
            --exclude tests/harness/aci/bash-output-stop.test.ts \
            --exclude tests/harness/aci/bash-service-loop.e2e.test.ts \
            --exclude tests/harness/aci/demo.test.ts \
            --exclude tests/harness/aci/interrupt-routing.test.ts \
            --exclude tests/harness/aci/tools/bash.test.ts \
            --exclude tests/harness/aci/tools/bash-readonly.test.ts \
            --exclude tests/harness/aci/tools/grep.test.ts \
            --exclude tests/harness/aci/tools/query-trace.test.ts \
            --exclude tests/harness/aci/permission.test.ts \
            --exclude tests/harness/aci/registry-workspace-root.test.ts \
            --exclude tests/harness/aci/tools/d9-description-guard.test.ts \
            --exclude tests/harness/aci/tools/registry.test.ts \
            --exclude tests/harness/aci/tools/registry-lsp-ctx.test.ts \
            --exclude tests/harness/agent-status-bar.test.ts \
            --exclude tests/harness/identity/agent-status-read-rule.test.ts \
            --exclude tests/harness/identity/system-injection.test.ts \
            --exclude tests/session-api/max-turns-serve.test.ts \
            --exclude tests/session-api/workspace-bind.test.ts \
            --exclude tests/session-api/hub-worktree-isolation.test.ts \
            --exclude tests/tui/deps-tools.test.ts \
            --exclude tests/cli/tui-deps-subagent-trace-factory.test.ts \
            --exclude tests/cli/chat-subagent-trace.test.ts \
            --exclude tests/build-engine-hooks.test.ts \
            --exclude tests/integration/mcp-chain.test.ts \
            --exclude tests/e2e/skill-mcp-acceptance.test.ts \
            --exclude tests/harness/build-engine.test.ts \
            --exclude tests/harness/build-engine-mcp-roots.test.ts \
            --exclude tests/harness/build-engine-auto-memory.test.ts \
            --exclude tests/harness/build-engine-subagent-trace.test.ts \
            --exclude tests/harness/graph/run-graph-assembly.test.ts \
            --exclude tests/session-api/ensure-deps-aci-tools.test.ts \
            --exclude tests/subagent/worker-tool-surface.test.ts \
            --exclude tests/subagent/worker.test.ts \
            --exclude tests/subagent/worker-lsp-wiring.test.ts \
            --exclude tests/subagent/envelope-role.test.ts \
            --exclude tests/subagent/tool-constraints.test.ts \
            --exclude tests/subagent/bash-mode-channel.test.ts \
            --exclude tests/tui/banner-scroll-fixes.test.tsx \
            --exclude tests/tui/logo-persists.test.tsx \
            --exclude tests/harness/secret-roundtrip/e2e.test.ts \
            --exclude tests/harness/mcp/zero-linkage-guard.test.ts \
            --exclude tests/harness/mcp/build-engine-mcp-overview.test.ts \
            --exclude tests/harness/sandbox/runner.test.ts \
            --exclude tests/subagent/envelope-freeze.test.ts
