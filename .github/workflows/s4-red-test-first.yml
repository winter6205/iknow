name: S4 red-test-first

on:
  push: {branches: [master]}
  pull_request: {branches: [master]}

jobs:
  s4-check:
    runs-on: ubuntu-latest
    # 与现有 ci.yml 一致:continue-on-error (informational gate, 失败不自动拦)
    # 想要硬强制时改 continue-on-error: false
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史才能跑 git diff HEAD~1
          fetch-depth: 0

      - name: Run S4 red-test-first check on latest commit
        run: |
          set -e
          COMMIT_MSG_FILE=$(mktemp)
          git log -1 --pretty=%B > "$COMMIT_MSG_FILE"
          bash .githooks/s4-red-test-first.sh "$COMMIT_MSG_FILE"
