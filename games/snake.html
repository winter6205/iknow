<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>贪吃蛇 Snake</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --grid: #16202f;
        --snake: #34d399;
        --snake-head: #a7f3d0;
        --food: #f87171;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        -webkit-user-select: none;
        user-select: none;
      }
      h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: 2px;
      }
      .scores {
        display: flex;
        gap: 24px;
        color: var(--muted);
        font-size: 14px;
      }
      .scores b {
        color: var(--text);
        font-size: 18px;
      }
      .wrap {
        position: relative;
      }
      canvas {
        background: var(--panel);
        border: 2px solid #334155;
        border-radius: 12px;
        display: block;
        image-rendering: pixelated;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgba(15, 23, 42, 0.82);
        border-radius: 12px;
        text-align: center;
        padding: 16px;
      }
      .overlay.hidden {
        display: none;
      }
      .overlay .title {
        font-size: 26px;
        font-weight: 700;
      }
      .overlay .sub {
        color: var(--muted);
        font-size: 14px;
      }
      button {
        background: var(--snake);
        color: #052e22;
        border: none;
        padding: 10px 22px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
      }
      .dpad {
        display: none;
        grid-template-columns: repeat(3, 56px);
        grid-template-rows: repeat(3, 56px);
        gap: 6px;
      }
      .dpad button {
        background: var(--panel);
        color: var(--text);
        font-size: 20px;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 0;
      }
      .dpad .up {
        grid-column: 2;
        grid-row: 1;
      }
      .dpad .left {
        grid-column: 1;
        grid-row: 2;
      }
      .dpad .right {
        grid-column: 3;
        grid-row: 2;
      }
      .dpad .down {
        grid-column: 2;
        grid-row: 3;
      }
      @media (pointer: coarse) {
        .dpad {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <h1>🐍 贪吃蛇</h1>
    <div class="scores">
      <div>得分 <b id="score">0</b></div>
      <div>最高 <b id="best">0</b></div>
    </div>

    <div class="wrap">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <div class="title" id="ovTitle">贪吃蛇</div>
        <div class="sub" id="ovSub">方向键 / WASD 移动，空格暂停</div>
        <button id="startBtn">开始游戏</button>
      </div>
    </div>

    <div class="hint">按方向键 / WASD 转向 · 空格暂停 / 继续</div>

    <div class="dpad">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="right" data-dir="right">▶</button>
      <button class="down" data-dir="down">▼</button>
    </div>

    <script>
      (function () {
        "use strict";

        // ---- 配置 ----
        const GRID = 20; // 每格像素
        const COLS = 20;
        const ROWS = 20;
        const BASE_INTERVAL = 130; // 起始每步毫秒
        const MIN_INTERVAL = 60; // 最快每步毫秒
        const SPEEDUP = 3; // 每吃一个提速毫秒

        const DIRS = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 },
        };
        const OPPOSITE = {
          up: "down",
          down: "up",
          left: "right",
          right: "left",
        };

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");
        const overlay = document.getElementById("overlay");
        const ovTitle = document.getElementById("ovTitle");
        const ovSub = document.getElementById("ovSub");
        const startBtn = document.getElementById("startBtn");

        // ---- 状态 ----
        let snake,
          dir,
          nextDir,
          food,
          score,
          best,
          timer,
          alive,
          paused,
          started;
        let step = 0;

        best = Number(localStorage.getItem("snake.best") || 0);
        bestEl.textContent = best;

        function reset() {
          snake = [
            { x: 8, y: 10 },
            { x: 7, y: 10 },
            { x: 6, y: 10 },
          ];
          dir = "right";
          nextDir = "right";
          score = 0;
          step = 0;
          alive = true;
          paused = false;
          scoreEl.textContent = score;
          placeFood();
        }

        function placeFood() {
          const free = [];
          const occupied = new Set(snake.map((s) => s.x + "," + s.y));
          for (let x = 0; x < COLS; x++) {
            for (let y = 0; y < ROWS; y++) {
              if (!occupied.has(x + "," + y)) free.push({ x, y });
            }
          }
          food = free[Math.floor(Math.random() * free.length)];
        }

        function interval() {
          return Math.max(MIN_INTERVAL, BASE_INTERVAL - score * SPEEDUP);
        }

        function tick() {
          if (!alive || paused) return;
          dir = nextDir;
          const head = {
            x: snake[0].x + DIRS[dir].x,
            y: snake[0].y + DIRS[dir].y,
          };

          // 撞墙
          if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
            return gameOver();
          }
          // 撞自己（尾巴这步会挪走，不算撞）
          const body = snake.slice(0, snake.length - 1);
          if (body.some((s) => s.x === head.x && s.y === head.y)) {
            return gameOver();
          }

          snake.unshift(head);
          if (head.x === food.x && head.y === food.y) {
            score++;
            scoreEl.textContent = score;
            placeFood();
            clearInterval(timer);
            timer = setInterval(tick, interval());
          } else {
            snake.pop();
          }
          draw();
        }

        function gameOver() {
          alive = false;
          clearInterval(timer);
          if (score > best) {
            best = score;
            localStorage.setItem("snake.best", String(best));
            bestEl.textContent = best;
          }
          ovTitle.textContent = "游戏结束 💀";
          ovSub.textContent =
            "得分 " + score + (score >= best && score > 0 ? " · 新纪录！" : "");
          startBtn.textContent = "再来一局";
          overlay.classList.remove("hidden");
          draw();
        }

        function start() {
          reset();
          started = true;
          overlay.classList.add("hidden");
          clearInterval(timer);
          timer = setInterval(tick, interval());
          draw();
        }

        function togglePause() {
          if (!started || !alive) return;
          paused = !paused;
          if (paused) {
            ovTitle.textContent = "已暂停 ⏸";
            ovSub.textContent = "按空格继续";
            startBtn.textContent = "继续";
            overlay.classList.remove("hidden");
          } else {
            overlay.classList.add("hidden");
          }
        }

        function setDir(d) {
          if (!started || !alive) return;
          if (OPPOSITE[d] === dir) return; // 不能 180° 掉头
          nextDir = d;
        }

        function draw() {
          ctx.fillStyle = "#1e293b";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // 网格
          ctx.strokeStyle = "#16202f";
          ctx.lineWidth = 1;
          for (let i = 1; i < COLS; i++) {
            ctx.beginPath();
            ctx.moveTo(i * GRID + 0.5, 0);
            ctx.lineTo(i * GRID + 0.5, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * GRID + 0.5);
            ctx.lineTo(canvas.width, i * GRID + 0.5);
            ctx.stroke();
          }

          // 食物
          ctx.fillStyle = "#f87171";
          roundRect(
            food.x * GRID + 3,
            food.y * GRID + 3,
            GRID - 6,
            GRID - 6,
            4
          );
          ctx.fill();

          // 蛇
          snake.forEach((s, i) => {
            const pad = 1;
            const r = i === 0 ? 5 : 3;
            ctx.fillStyle = i === 0 ? "#a7f3d0" : "#34d399";
            roundRect(
              s.x * GRID + pad,
              s.y * GRID + pad,
              GRID - pad * 2,
              GRID - pad * 2,
              r
            );
            ctx.fill();
          });

          // 蛇头眼睛
          if (snake.length && alive) {
            const h = snake[0];
            const cx = h.x * GRID + GRID / 2;
            const cy = h.y * GRID + GRID / 2;
            const d = DIRS[dir];
            const px = d.y,
              py = -d.x; // 垂直方向
            ctx.fillStyle = "#052e22";
            [{ o: 4 }, { o: -4 }].forEach(({ o }) => {
              const ex = cx + d.x * 3 + px * o;
              const ey = cy + d.y * 3 + py * o;
              ctx.beginPath();
              ctx.arc(ex, ey, 2, 0, Math.PI * 2);
              ctx.fill();
            });
          }
        }

        function roundRect(x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }

        // ---- 事件 ----
        const KEYMAP = {
          ArrowUp: "up",
          ArrowDown: "down",
          ArrowLeft: "left",
          ArrowRight: "right",
          w: "up",
          s: "down",
          a: "left",
          d: "right",
          W: "up",
          S: "down",
          A: "left",
          D: "right",
        };

        window.addEventListener("keydown", (e) => {
          if (e.code === "Space") {
            e.preventDefault();
            togglePause();
            return;
          }
          if (e.key === "Enter") {
            e.preventDefault();
            if (!started || !alive) start();
            return;
          }
          const d = KEYMAP[e.key];
          if (d) {
            e.preventDefault();
            setDir(d);
          }
        });

        startBtn.addEventListener("click", start);

        document.querySelectorAll(".dpad button").forEach((b) => {
          b.addEventListener("click", () => {
            if (!started || !alive) {
              start();
              return;
            }
            setDir(b.dataset.dir);
          });
        });

        // 触摸滑动支持
        let touchStart = null;
        window.addEventListener(
          "touchstart",
          (e) => {
            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          },
          { passive: true }
        );
        window.addEventListener(
          "touchend",
          (e) => {
            if (!touchStart) return;
            const dx = e.changedTouches[0].clientX - touchStart.x;
            const dy = e.changedTouches[0].clientY - touchStart.y;
            touchStart = null;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
            if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? "right" : "left");
            else setDir(dy > 0 ? "down" : "up");
          },
          { passive: true }
        );

        // ---- 初始 ----
        reset();
        draw();
      })();
    </script>
  </body>
</html>
