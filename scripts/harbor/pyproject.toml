[project]
name = "iknow-harbor"
version = "0.1.0"
description = "Harbor adapter that installs the iknow CLI in a Terminal-Bench task container and drives `iknow ask`"
requires-python = ">=3.12"
# The adapter is imported by Harbor's own interpreter; pinning the reviewed
# version keeps `--agent iknow_harbor.agent:IKnowAgent` from drifting.
dependencies = ["harbor==0.23.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iknow_harbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
